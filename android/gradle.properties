# Keep Gradle and Kotlin compiler daemons bounded on the 16 GB host.
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true -Dkotlin.daemon.options=autoshutdownIdleSeconds=3600,shutdownDelayMilliseconds=1000 -Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.daemon.idletimeout=3600000
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# Flutter 3.47 still uses the legacy Android DSL; retain until its plugin migrates.
android.newDsl=false
# Opt in explicitly so Flutter does not reinsert the legacy KGP setting.
android.builtInKotlin=true
