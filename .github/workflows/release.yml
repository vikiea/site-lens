name: Release Site Lens

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      tag:
        description: Release tag, for example v0.2.0.alpha1
        required: true
        type: string
      version_bump:
        description: Version bump policy for the tag base
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      version_code:
        description: Android versionCode override (auto derives it from release tags)
        required: false
        default: auto
        type: string
      minimum_version_code:
        description: Optional installed versionCode floor for emergency/manual builds
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fixed Flutter SDK
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve and validate release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_CHANNEL: ${{ inputs.channel || 'stable' }}
          DISPATCH_BUMP: ${{ inputs.version_bump || 'auto' }}
          DISPATCH_VERSION_CODE: ${{ inputs.version_code || 'auto' }}
          DISPATCH_MINIMUM_VERSION_CODE: ${{ inputs.minimum_version_code || '0' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          channel="$DISPATCH_CHANNEL"
          bump="$DISPATCH_BUMP"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            if [[ "$tag" =~ \.((alpha|beta|rc)(0|[1-9][0-9]*))$ ]]; then
              channel=beta
            else
              channel=stable
            fi
          fi
          python3 - "$tag" "$channel" <<'PY'
          import re
          import sys
          tag = sys.argv[1]
          channel = sys.argv[2]
          stable = r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          beta = stable + r"\.(alpha|beta|rc)(0|[1-9][0-9]*)"
          pattern = beta if channel == "beta" else stable
          if channel not in {"stable", "beta"} or not re.fullmatch(pattern, tag):
              raise SystemExit(f"invalid release tag: {tag}")
          PY
          git rev-parse "$tag^{commit}" >/dev/null
          mkdir -p dist
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > dist/releases.json
          python3 tool/extract_release_version_codes.py \
            --input dist/releases.json \
            --output dist/published-version-codes.txt
          pubspec_code="$(sed -n 's/^version:.*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml | head -1)"
          test -n "$pubspec_code"
          minimum_code="$DISPATCH_MINIMUM_VERSION_CODE"
          if (( pubspec_code > minimum_code )); then minimum_code="$pubspec_code"; fi
          # Older stable releases predate versionCode release-note records.
          # Read the current stable APK's manifest so the shared sequence also
          # includes the versionCode shipped from main.
          stable_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease,isDraft \
            --jq '[.[] | select(.isPrerelease == false and .isDraft == false)][0].tagName // empty')"
          main_stable_code=0
          if [[ -n "$stable_tag" ]]; then
            stable_apk_name="$(gh release view "$stable_tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[] | select(.name | endswith(".apk")) | .name' | head -1)"
            test -n "$stable_apk_name" || { echo "stable release $stable_tag has no APK asset" >&2; exit 1; }
            mkdir -p dist/stable-baseline
            gh release download "$stable_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$stable_apk_name" \
              --dir dist/stable-baseline
            apkanalyzer_bin="$(command -v apkanalyzer || true)"
            if [[ -z "$apkanalyzer_bin" && -n "${ANDROID_HOME:-}" ]]; then
              for candidate in \
                "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
                "$ANDROID_HOME/cmdline-tools/bin/apkanalyzer"; do
                if [[ -x "$candidate" ]]; then
                  apkanalyzer_bin="$candidate"
                  break
                fi
              done
            fi
            test -n "$apkanalyzer_bin" || { echo "apkanalyzer is required to read the stable APK versionCode" >&2; exit 1; }
            main_stable_code="$("$apkanalyzer_bin" manifest version-code "dist/stable-baseline/$stable_apk_name")"
            [[ "$main_stable_code" =~ ^[1-9][0-9]*$ ]] || {
              echo "invalid stable APK versionCode: $main_stable_code" >&2
              exit 1
            }
          fi
          version_args=(
            --tag "$tag"
            --channel "$channel"
            --published-codes-file dist/published-version-codes.txt
            --main-stable-code "$main_stable_code"
          )
          if [[ "$DISPATCH_VERSION_CODE" != "auto" && -n "$DISPATCH_VERSION_CODE" ]]; then
            version_args+=(--override "$DISPATCH_VERSION_CODE")
          fi
          python3 tool/determine_version_code.py \
            "${version_args[@]}" \
            --minimum-code "$minimum_code" > dist/version-code.json
          cat dist/version-code.json
          python3 tool/determine_release_version.py \
            --tag "$tag" \
            --channel "$channel" \
            --bump "$bump" > dist/release-version.json
          cat dist/release-version.json
          bump="$(python3 -c 'import json; print(json.load(open("dist/release-version.json"))["bump"])')"
          reason="$(python3 -c 'import json; print(json.load(open("dist/release-version.json"))["reason"])')"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "bump_reason=$reason" >> "$GITHUB_OUTPUT"
          version_code="$(python3 -c 'import json; print(json.load(open("dist/version-code.json"))["version_code"])')"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Generate categorized release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          BUMP: ${{ steps.release.outputs.bump }}
          BUMP_REASON: ${{ steps.release.outputs.bump_reason }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' > dist/eligible-release-tags.txt
          python3 tool/generate_release_notes.py \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --output dist/release-notes.md \
            --eligible-tags-file dist/eligible-release-tags.txt
          {
            echo
            echo "## 版本判断"
            echo "- 本次版本基线：\`$TAG\`。"
            echo "- 版本级别：**$BUMP**；$BUMP_REASON。"
            echo "- Android versionCode: \`$VERSION_CODE\`."
          } >> dist/release-notes.md
          test -s dist/release-notes.md
          sed -n '1,160p' dist/release-notes.md

      - name: Run repository checks
        shell: bash
        run: |
          set -euo pipefail
          # The bootstrap tests exercise .env alias precedence. The fixed SDK
          # is supplied through PATH for this job, so clear any runner-level
          # SDK aliases before running those tests.
          unset FLUTTER_ROOT FLUTTER_BIN_DIR SITE_LENS_ENV_FILE
          ./tool/check.sh

      - name: Restore formal signing configuration
        env:
          SITE_LENS_KEYSTORE_BASE64: ${{ secrets.SITE_LENS_KEYSTORE_BASE64 }}
          SITE_LENS_KEYSTORE_PASSWORD: ${{ secrets.SITE_LENS_KEYSTORE_PASSWORD }}
          SITE_LENS_KEY_ALIAS: ${{ secrets.SITE_LENS_KEY_ALIAS }}
          SITE_LENS_KEY_PASSWORD: ${{ secrets.SITE_LENS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_LENS_KEYSTORE_BASE64"
          test -n "$SITE_LENS_KEYSTORE_PASSWORD"
          test -n "$SITE_LENS_KEY_ALIAS"
          test -n "$SITE_LENS_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/site-lens-release.jks"
          properties="$RUNNER_TEMP/site-lens-signing.properties"
          printf '%s' "$SITE_LENS_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$SITE_LENS_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$SITE_LENS_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$SITE_LENS_KEY_PASSWORD"
          } > "$properties"
          chmod 600 "$properties"
          echo "SITE_LENS_SIGNING_PROPERTIES=$properties" >> "$GITHUB_ENV"

      - name: Build and verify formal APK
        env:
          BUILD_NAME: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.version_code }}
        run: |
          make build-release BUILD_NAME="$BUILD_NAME" BUILD_NUMBER="$BUILD_NUMBER"

      - name: Prepare release assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_name="site-lens-${TAG}.apk"
          apk="dist/$apk_name"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          (cd dist && sha256sum "$apk_name") > "$apk.sha256"
          ls -lh dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            title="Site Lens $TAG"
            args=("$TAG" --title "$title" --target "$(git rev-parse HEAD)" --notes-file dist/release-notes.md)
            if [[ "$CHANNEL" == "beta" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          else
            gh release edit "$TAG" --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" \
            "dist/site-lens-${TAG}.apk" \
            "dist/site-lens-${TAG}.apk.sha256" \
            --clobber
