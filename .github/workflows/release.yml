name: Release Site Lens

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  allocate_version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: version-code-allocation
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.allocate.outputs.tag }}
      version: ${{ steps.allocate.outputs.version }}
      version_code: ${{ steps.allocate.outputs.version_code }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Allocate and reserve versionCode
        id: allocate
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          python3 - "$tag" <<'PY'
          import re
          import sys
          tag = sys.argv[1]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          PY
          git rev-parse "$tag^{commit}" >/dev/null
          mkdir -p dist
          release_sha="$(git rev-parse "$tag^{commit}")"
          refresh_reservations() {
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/version-code/" \
              > dist/version-code-refs.json
            python3 tool/version_code_reservations.py \
              --input dist/version-code-refs.json \
              --tag "$tag" \
              --output dist/version-code-reservations.json
          }
          refresh_reservations
          existing_code="$(python3 - <<'PY'
          import json
          value = json.load(open("dist/version-code-reservations.json"))["existing_code"]
          print("" if value is None else value)
          PY
          )"
          if [[ -n "$existing_code" ]]; then
            version_code="$existing_code"
            echo "Reusing version-code reservation $version_code for $tag"
          else
            pubspec_code="$(sed -n 's/^version:.*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml | head -1)"
            test -n "$pubspec_code"
            stable_code=0
            stable_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isPrerelease,isDraft \
              --jq '[.[] | select(.isPrerelease == false and .isDraft == false)][0].tagName // empty')"
            if [[ -n "$stable_tag" ]]; then
              stable_apk_name="$(gh release view "$stable_tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[] | select(.name | endswith(".apk")) | .name' | head -1)"
              test -n "$stable_apk_name" || { echo "stable release $stable_tag has no APK asset" >&2; exit 1; }
              mkdir -p dist/stable-baseline
              gh release download "$stable_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$stable_apk_name" \
                --dir dist/stable-baseline
              apkanalyzer_bin="$(command -v apkanalyzer || true)"
              if [[ -z "$apkanalyzer_bin" && -n "${ANDROID_HOME:-}" ]]; then
                for candidate in \
                  "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
                  "$ANDROID_HOME/cmdline-tools/bin/apkanalyzer"; do
                  if [[ -x "$candidate" ]]; then
                    apkanalyzer_bin="$candidate"
                    break
                  fi
                done
              fi
              test -n "$apkanalyzer_bin" || { echo "apkanalyzer is required to read the stable APK versionCode" >&2; exit 1; }
              stable_code="$($apkanalyzer_bin manifest version-code "dist/stable-baseline/$stable_apk_name")"
              [[ "$stable_code" =~ ^[1-9][0-9]*$ ]] || {
                echo "invalid stable APK versionCode: $stable_code" >&2
                exit 1
              }
            fi
            highest_reserved="$(python3 - <<'PY'
          import json
          print(json.load(open("dist/version-code-reservations.json"))["highest_reserved_version_code"])
          PY
            )"
            floor="$pubspec_code"
            if (( stable_code > floor )); then floor="$stable_code"; fi
            if (( highest_reserved > floor )); then floor="$highest_reserved"; fi
            version_code=$((floor + 1))
            for attempt in $(seq 1 20); do
              marker_ref="$(python3 - "$tag" "$version_code" <<'PY'
          import sys
          sys.path.insert(0, "tool")
          from version_code_reservations import reservation_ref
          print(reservation_ref(sys.argv[1], int(sys.argv[2])))
          PY
              )"
              if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=$marker_ref" \
                -f "sha=$release_sha" \
                >dist/version-code-reservation-response.json 2>dist/version-code-reservation-error.log; then
                echo "Created immutable version-code reservation $marker_ref"
                break
              fi
              refresh_reservations
              existing_code="$(python3 - <<'PY'
          import json
          value = json.load(open("dist/version-code-reservations.json"))["existing_code"]
          print("" if value is None else value)
          PY
              )"
              if [[ -n "$existing_code" ]]; then
                version_code="$existing_code"
                echo "Using reservation created by a concurrent run: $version_code"
                break
              fi
              highest_reserved="$(python3 - <<'PY'
          import json
          print(json.load(open("dist/version-code-reservations.json"))["highest_reserved_version_code"])
          PY
              )"
              floor="$pubspec_code"
              if (( stable_code > floor )); then floor="$stable_code"; fi
              if (( highest_reserved >= version_code )); then floor="$highest_reserved"; fi
              version_code=$((floor + 1))
            done
            echo "failed to create a version-code reservation after 20 attempts" >&2
            cat dist/version-code-reservation-error.log >&2 || true
            exit 1
          fi
          if (( version_code <= 0 || version_code > 2100000000 )); then
            echo "versionCode is outside Android's supported range: $version_code" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "versionCode=$version_code"

  release:
    needs: allocate_version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fixed Flutter SDK
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Run repository checks
        shell: bash
        run: |
          set -euo pipefail
          # The bootstrap tests exercise .env alias precedence. The fixed SDK
          # is supplied through PATH for this job, so clear any runner-level
          # SDK aliases before running those tests.
          unset FLUTTER_ROOT FLUTTER_BIN_DIR SITE_LENS_ENV_FILE
          ./tool/check.sh

      - name: Restore formal signing configuration
        env:
          SITE_LENS_KEYSTORE_BASE64: ${{ secrets.SITE_LENS_KEYSTORE_BASE64 }}
          SITE_LENS_KEYSTORE_PASSWORD: ${{ secrets.SITE_LENS_KEYSTORE_PASSWORD }}
          SITE_LENS_KEY_ALIAS: ${{ secrets.SITE_LENS_KEY_ALIAS }}
          SITE_LENS_KEY_PASSWORD: ${{ secrets.SITE_LENS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_LENS_KEYSTORE_BASE64"
          test -n "$SITE_LENS_KEYSTORE_PASSWORD"
          test -n "$SITE_LENS_KEY_ALIAS"
          test -n "$SITE_LENS_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/site-lens-release.jks"
          properties="$RUNNER_TEMP/site-lens-signing.properties"
          printf '%s' "$SITE_LENS_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$SITE_LENS_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$SITE_LENS_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$SITE_LENS_KEY_PASSWORD"
          } > "$properties"
          chmod 600 "$properties"
          echo "SITE_LENS_SIGNING_PROPERTIES=$properties" >> "$GITHUB_ENV"

      - name: Build and verify formal APK
        env:
          BUILD_NAME: ${{ needs.allocate_version.outputs.version }}
          BUILD_NUMBER: ${{ needs.allocate_version.outputs.version_code }}
        run: |
          make build-release BUILD_NAME="$BUILD_NAME" BUILD_NUMBER="$BUILD_NUMBER"

      - name: Prepare release assets
        env:
          TAG: ${{ needs.allocate_version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_name="site-lens-${TAG}.apk"
          apk="dist/$apk_name"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          (cd dist && sha256sum "$apk_name") > "$apk.sha256"
          ls -lh dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.allocate_version.outputs.tag }}
          VERSION: ${{ needs.allocate_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=("$TAG" --title "Site Lens $TAG" --target "$(git rev-parse HEAD)" --generate-notes)
            gh release create "${args[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
