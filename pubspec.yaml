name: site_lens
description: A local-first, manually selected multi-site browser with capability-gated user scripts.
publish_to: none
version: 0.1.14+12
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  sqlite3: ^3.7.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  archive: ^4.5.2
  workmanager: ^0.10.10
  liquid_glass_widgets: '1.13.0'
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  http: ^1.6.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.10
flutter:
  uses-material-design: true
  assets:
    - web_assets/userscript_runtime.js
    - web_assets/page_inspector.js
    - web_assets/media_lifecycle.js
    - integration_test/fixtures/miss_player_5.6.17.user.js
